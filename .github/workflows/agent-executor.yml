name: LEDGER AI Task Executor

on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'

permissions: {}

concurrency:
  group: ledger-agent-executor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claim-task:
    if: github.event_name == 'workflow_dispatch' || vars.LEDGER_AGENT_EXECUTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      AGENT_TASK_PATH: /tmp/ledger-agent-task.json
      AGENT_PROMPT_PATH: /tmp/ledger-agent-prompt.md
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      has_task: ${{ steps.claim.outputs.has_task }}
      execute: ${{ steps.claim.outputs.execute }}
      issue_number: ${{ steps.claim.outputs.issue_number }}
      owner: ${{ steps.claim.outputs.owner }}
      risk: ${{ steps.claim.outputs.risk }}
      security_review: ${{ steps.claim.outputs.security_review }}
      branch: ${{ steps.claim.outputs.branch }}
      base_sha: ${{ steps.base.outputs.sha }}
      task_sha: ${{ steps.freeze.outputs.task_sha }}
      prompt_sha: ${{ steps.freeze.outputs.prompt_sha }}
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install repository dependencies before claiming work
        run: python -m pip install -r requirements.txt

      - name: Verify executor credential exists before claiming work
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; refusing to claim a task." >&2
            exit 1
          fi

      - name: Verify operator safety tests
        run: >-
          python -m unittest
          tests.test_agent_operator
          tests.test_agent_operator_workflow
          tests.test_agent_operator_lifecycle
          tests.test_agent_scope_guard
          tests.test_agent_review_gate
          -v

      - name: Record immutable base SHA
        id: base
        run: |
          BASE_SHA="$(git rev-parse HEAD)"
          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid base SHA: $BASE_SHA" >&2
            exit 1
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Claim next safe queued task
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agent_operator.claim

      - name: Report empty queue
        if: steps.claim.outputs.has_task != 'true'
        run: echo "No eligible queued task; executor is idle."

      - name: Freeze immutable task contract
        if: steps.claim.outputs.execute == 'true'
        id: freeze
        run: |
          mkdir -p "$RUNNER_TEMP/ledger-task-contract"
          cp "$AGENT_TASK_PATH" "$RUNNER_TEMP/ledger-task-contract/task.json"
          cp "$AGENT_PROMPT_PATH" "$RUNNER_TEMP/ledger-task-contract/prompt.md"
          TASK_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/task.json" | cut -d' ' -f1)"
          PROMPT_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/prompt.md" | cut -d' ' -f1)"
          echo "task_sha=$TASK_SHA" >> "$GITHUB_OUTPUT"
          echo "prompt_sha=$PROMPT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload immutable task contract
        if: steps.claim.outputs.execute == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledger-task-contract
          path: ${{ runner.temp }}/ledger-task-contract
          if-no-files-found: error
          retention-days: 1

      - name: Mark task working
        if: steps.claim.outputs.execute == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.claim.outputs.issue_number }}
          BRANCH: ${{ steps.claim.outputs.branch }}
        run: >-
          python -m agent_operator.transition
          --issue "$ISSUE_NUMBER"
          --state agent:working
          --comment "Implementation has started for reserved branch \`$BRANCH\`. Publication remains gated by isolated verification and human review."

  implement-task:
    needs: claim-task
    if: needs.claim-task.result == 'success' && needs.claim-task.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact claimed base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim-task.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install repository dependencies before model execution
        run: python -m pip install -r requirements.txt

      - name: Download immutable task contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledger-task-contract
          path: ${{ runner.temp }}/ledger-task-contract

      - name: Verify task contract integrity
        env:
          EXPECTED_TASK_SHA: ${{ needs.claim-task.outputs.task_sha }}
          EXPECTED_PROMPT_SHA: ${{ needs.claim-task.outputs.prompt_sha }}
        run: |
          ACTUAL_TASK_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/task.json" | cut -d' ' -f1)"
          ACTUAL_PROMPT_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/prompt.md" | cut -d' ' -f1)"
          test -n "$EXPECTED_TASK_SHA"
          test -n "$EXPECTED_PROMPT_SHA"
          test "$ACTUAL_TASK_SHA" = "$EXPECTED_TASK_SHA"
          test "$ACTUAL_PROMPT_SHA" = "$EXPECTED_PROMPT_SHA"

      - name: Respect human stop before model execution
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
        run: |
          LABELS="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$LABELS" | grep -Eq '^(needs:human|agent:paused)$'; then
            echo "Human stop is active; refusing model execution." >&2
            exit 1
          fi
          if ! printf '%s\n' "$LABELS" | grep -qx 'agent:working'; then
            echo "Issue is no longer in agent:working; refusing model execution." >&2
            exit 1
          fi

      - name: Run primary Codex implementation agent
        id: implement
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        with:
          allow-bots: true
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          working-directory: ${{ github.workspace }}
          prompt-file: ${{ runner.temp }}/ledger-task-contract/prompt.md
          output-file: ${{ runner.temp }}/ledger-implementation-result.md
          effort: ${{ vars.LEDGER_CODEX_EFFORT || 'medium' }}
          model: ${{ vars.LEDGER_CODEX_MODEL }}

      - name: Capture implementation filesystem without trusting its git metadata
        run: |
          /usr/bin/tar \
            --exclude='./.git' \
            --exclude='./.git/**' \
            -cf "$RUNNER_TEMP/ledger-implementation-tree.tar" \
            -C "$GITHUB_WORKSPACE" .

      - name: Upload raw implementation tree for isolated verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledger-implementation-tree
          path: ${{ runner.temp }}/ledger-implementation-tree.tar
          if-no-files-found: error
          retention-days: 1

  verify-task:
    needs: [claim-task, implement-task]
    if: needs.implement-task.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact claimed base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim-task.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install trusted base dependencies
        run: python -m pip install -r requirements.txt

      - name: Download immutable task contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledger-task-contract
          path: ${{ runner.temp }}/ledger-task-contract

      - name: Verify task contract integrity before verification
        env:
          EXPECTED_TASK_SHA: ${{ needs.claim-task.outputs.task_sha }}
          EXPECTED_PROMPT_SHA: ${{ needs.claim-task.outputs.prompt_sha }}
        run: |
          ACTUAL_TASK_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/task.json" | cut -d' ' -f1)"
          ACTUAL_PROMPT_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/prompt.md" | cut -d' ' -f1)"
          test "$ACTUAL_TASK_SHA" = "$EXPECTED_TASK_SHA"
          test "$ACTUAL_PROMPT_SHA" = "$EXPECTED_PROMPT_SHA"

      - name: Download raw implementation tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledger-implementation-tree
          path: ${{ runner.temp }}/ledger-implementation-artifact

      - name: Reconstruct trusted base and isolated model tree
        env:
          BASE_SHA: ${{ needs.claim-task.outputs.base_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ledger-base-tree" "$RUNNER_TEMP/ledger-model-tree"
          git archive "$BASE_SHA" | /usr/bin/tar -x -C "$RUNNER_TEMP/ledger-base-tree"
          /usr/bin/tar -xf "$RUNNER_TEMP/ledger-implementation-artifact/ledger-implementation-tree.tar" \
            -C "$RUNNER_TEMP/ledger-model-tree"

      - name: Enforce frozen task scope from trusted base without model git state
        run: >-
          cd "$RUNNER_TEMP/ledger-base-tree" &&
          python -m agent_operator.scope_guard check
          --source "$RUNNER_TEMP/ledger-model-tree"
          --base-tree "$RUNNER_TEMP/ledger-base-tree"
          --allowed-paths-file "$RUNNER_TEMP/ledger-task-contract/task.json"
          --manifest-out "$RUNNER_TEMP/ledger-change-manifest.json"

      - name: Require an actual verified implementation change
        run: |
          CHANGE_COUNT="$(python -I -S -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["changes"]))' "$RUNNER_TEMP/ledger-change-manifest.json")"
          if [ "$CHANGE_COUNT" -le 0 ]; then
            echo "Implementation produced no publishable repository change." >&2
            exit 1
          fi

      - name: Materialize verified changes into clean base checkout
        run: >-
          cd "$RUNNER_TEMP/ledger-base-tree" &&
          python -m agent_operator.scope_guard apply
          --source "$RUNNER_TEMP/ledger-model-tree"
          --destination "$GITHUB_WORKSPACE"
          --manifest "$RUNNER_TEMP/ledger-change-manifest.json"

      - name: Confirm clean reconstruction exactly matches verified manifest
        run: |
          cd "$RUNNER_TEMP/ledger-base-tree"
          python -m agent_operator.scope_guard check \
            --source "$GITHUB_WORKSPACE" \
            --base-tree "$RUNNER_TEMP/ledger-base-tree" \
            --allowed-paths-file "$RUNNER_TEMP/ledger-task-contract/task.json" \
            --manifest-out "$RUNNER_TEMP/ledger-rebuilt-manifest.json"
          cmp -s "$RUNNER_TEMP/ledger-change-manifest.json" "$RUNNER_TEMP/ledger-rebuilt-manifest.json"

      - name: Lock trusted verification inputs before proposed code executes
        run: |
          sudo chown -R root:root "$RUNNER_TEMP/ledger-base-tree" "$RUNNER_TEMP/ledger-task-contract"
          sudo chmod -R a-w "$RUNNER_TEMP/ledger-base-tree" "$RUNNER_TEMP/ledger-task-contract"
          sudo chown root:root "$RUNNER_TEMP/ledger-change-manifest.json"
          sudo chmod a-w "$RUNNER_TEMP/ledger-change-manifest.json"

      - name: Run repository test command in no-write-token verification job
        run: python -m unittest discover -s tests -v

      - name: Verify tests did not change the publishable proposal using locked trusted guard
        run: |
          cd "$RUNNER_TEMP/ledger-base-tree"
          python -m agent_operator.scope_guard check \
            --source "$GITHUB_WORKSPACE" \
            --base-tree "$RUNNER_TEMP/ledger-base-tree" \
            --allowed-paths-file "$RUNNER_TEMP/ledger-task-contract/task.json" \
            --manifest-out "$RUNNER_TEMP/ledger-posttest-manifest.json"
          cmp -s "$RUNNER_TEMP/ledger-change-manifest.json" "$RUNNER_TEMP/ledger-posttest-manifest.json"

  publish-task:
    needs: [claim-task, implement-task, verify-task]
    if: needs.verify-task.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
      pr_number: ${{ steps.pr.outputs.number }}
      proposal_sha: ${{ steps.context.outputs.proposal_sha }}
    steps:
      - name: Checkout exact claimed base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.claim-task.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download immutable task contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledger-task-contract
          path: ${{ runner.temp }}/ledger-task-contract

      - name: Download raw implementation tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledger-implementation-tree
          path: ${{ runner.temp }}/ledger-implementation-artifact

      - name: Reconstruct trusted base and isolated model tree
        env:
          BASE_SHA: ${{ needs.claim-task.outputs.base_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/ledger-base-tree" "$RUNNER_TEMP/ledger-model-tree"
          git archive "$BASE_SHA" | /usr/bin/tar -x -C "$RUNNER_TEMP/ledger-base-tree"
          /usr/bin/tar -xf "$RUNNER_TEMP/ledger-implementation-artifact/ledger-implementation-tree.tar" \
            -C "$RUNNER_TEMP/ledger-model-tree"

      - name: Re-verify frozen task scope independently before publication
        run: >-
          cd "$RUNNER_TEMP/ledger-base-tree" &&
          python -m agent_operator.scope_guard check
          --source "$RUNNER_TEMP/ledger-model-tree"
          --base-tree "$RUNNER_TEMP/ledger-base-tree"
          --allowed-paths-file "$RUNNER_TEMP/ledger-task-contract/task.json"
          --manifest-out "$RUNNER_TEMP/ledger-publish-manifest.json"

      - name: Verify immutable task contract again
        env:
          EXPECTED_TASK_SHA: ${{ needs.claim-task.outputs.task_sha }}
          EXPECTED_PROMPT_SHA: ${{ needs.claim-task.outputs.prompt_sha }}
        run: |
          ACTUAL_TASK_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/task.json" | cut -d' ' -f1)"
          ACTUAL_PROMPT_SHA="$(sha256sum "$RUNNER_TEMP/ledger-task-contract/prompt.md" | cut -d' ' -f1)"
          test -n "$EXPECTED_TASK_SHA"
          test -n "$EXPECTED_PROMPT_SHA"
          test "$ACTUAL_TASK_SHA" = "$EXPECTED_TASK_SHA"
          test "$ACTUAL_PROMPT_SHA" = "$EXPECTED_PROMPT_SHA"

      - name: Respect human stop before publication
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
        run: |
          LABELS="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$LABELS" | grep -Eq '^(needs:human|agent:paused)$'; then
            echo "Human stop is active; refusing publication." >&2
            exit 1
          fi
          if ! printf '%s\n' "$LABELS" | grep -qx 'agent:working'; then
            echo "Issue is no longer in agent:working; refusing publication." >&2
            exit 1
          fi

      - name: Create clean publication branch and materialize verified files
        env:
          BRANCH: ${{ needs.claim-task.outputs.branch }}
          BASE_SHA: ${{ needs.claim-task.outputs.base_sha }}
        run: |
          git switch -c "$BRANCH" "$BASE_SHA"
          cd "$RUNNER_TEMP/ledger-base-tree"
          python -m agent_operator.scope_guard apply \
            --source "$RUNNER_TEMP/ledger-model-tree" \
            --destination "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/ledger-publish-manifest.json"

      - name: Confirm publication checkout exactly matches verified manifest
        run: |
          cd "$RUNNER_TEMP/ledger-base-tree"
          python -m agent_operator.scope_guard check \
            --source "$GITHUB_WORKSPACE" \
            --base-tree "$RUNNER_TEMP/ledger-base-tree" \
            --allowed-paths-file "$RUNNER_TEMP/ledger-task-contract/task.json" \
            --manifest-out "$RUNNER_TEMP/ledger-publication-recheck.json"
          cmp -s "$RUNNER_TEMP/ledger-publish-manifest.json" "$RUNNER_TEMP/ledger-publication-recheck.json"

      - name: Commit clean verified proposal locally
        env:
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
        run: |
          git config user.name "ledger-agent[bot]"
          git config user.email "ledger-agent[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null add -A
          git -c core.hooksPath=/dev/null commit -m "Agent implementation for issue #$ISSUE_NUMBER"

      - name: Verify committed tree exactly matches verified manifest
        env:
          BASE_SHA: ${{ needs.claim-task.outputs.base_sha }}
        run: |
          rm -rf "$RUNNER_TEMP/ledger-commit-tree"
          mkdir -p "$RUNNER_TEMP/ledger-commit-tree"
          git archive HEAD | /usr/bin/tar -x -C "$RUNNER_TEMP/ledger-commit-tree"
          cd "$RUNNER_TEMP/ledger-base-tree"
          python -m agent_operator.scope_guard check \
            --source "$RUNNER_TEMP/ledger-commit-tree" \
            --base-tree "$RUNNER_TEMP/ledger-base-tree" \
            --allowed-paths-file "$RUNNER_TEMP/ledger-task-contract/task.json" \
            --manifest-out "$RUNNER_TEMP/ledger-commit-manifest.json"
          cmp -s "$RUNNER_TEMP/ledger-publish-manifest.json" "$RUNNER_TEMP/ledger-commit-manifest.json"

      - name: Push only the manifest-matched proposal branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.claim-task.outputs.branch }}
        run: |
          gh auth setup-git
          git -c core.hooksPath=/dev/null push --set-upstream origin "$BRANCH"

      - name: Open draft pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.claim-task.outputs.branch }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
          OWNER: ${{ needs.claim-task.outputs.owner }}
          RISK: ${{ needs.claim-task.outputs.risk }}
        run: |
          TITLE="$(python -I -S -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["issue"]["title"])' "$RUNNER_TEMP/ledger-task-contract/task.json")"
          BODY_FILE="$RUNNER_TEMP/ledger-agent-pr-body.md"
          cat > "$BODY_FILE" <<EOF
          ## Autonomous agent work

          Relates to #$ISSUE_NUMBER.

          - Primary owner: \`$OWNER\`
          - Risk: \`$RISK\`
          - Exact task paths were frozen before model execution and enforced independently afterward.
          - Implementation ran in a read-only-repository-permission job.
          - The repository test command returned success in a separate no-write-token verification job; protected-branch CI and human review are still required before merge.
          - Publication was rebuilt from a clean base checkout and the committed tree was compared back to the verified manifest before push.
          - QA and required Security/Data Integrity review run on separate fresh hardened runners.
          - This PR is intentionally **draft**.
          - No deployment, external action, or merge was performed.

          Automated reviewer evidence is posted only after trusted post-review validation. Claude is not invoked automatically.
          EOF
          PR_URL="$(gh pr create --draft --base main --head "$BRANCH" --title "Agent: $TITLE" --body-file "$BODY_FILE")"
          PR_NUMBER="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Freeze exact publication review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
          BRANCH: ${{ needs.claim-task.outputs.branch }}
          BASE_SHA: ${{ needs.claim-task.outputs.base_sha }}
          TASK_SHA: ${{ needs.claim-task.outputs.task_sha }}
          PROMPT_SHA: ${{ needs.claim-task.outputs.prompt_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          PROPOSAL_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$PROPOSAL_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName,baseRefName,isDraft,state --jq '.headRefOid')" = "$PROPOSAL_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')" = "$BRANCH"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')" = 'main'
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'true'
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = 'OPEN'
          mkdir -p "$RUNNER_TEMP/ledger-review-context"
          cp "$RUNNER_TEMP/ledger-publish-manifest.json" "$RUNNER_TEMP/ledger-review-context/publish-manifest.json"
          jq -n \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg branch "$BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg proposal_sha "$PROPOSAL_SHA" \
            --arg task_sha "$TASK_SHA" \
            --arg prompt_sha "$PROMPT_SHA" \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            '{issue_number:$issue_number,branch:$branch,base_sha:$base_sha,proposal_sha:$proposal_sha,task_sha:$task_sha,prompt_sha:$prompt_sha,pr_number:$pr_number,pr_url:$pr_url}' \
            > "$RUNNER_TEMP/ledger-review-context/context.json"
          echo "proposal_sha=$PROPOSAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload frozen publication review context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledger-review-context
          path: ${{ runner.temp }}/ledger-review-context
          if-no-files-found: error
          retention-days: 1

  qa-review:
    needs: [claim-task, publish-task]
    if: needs.publish-task.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      QA_REVIEW_PATH: /tmp/ledger-qa-review.json
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
