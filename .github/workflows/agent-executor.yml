        env:
          SECURITY_REQUIRED: ${{ needs.claim-task.outputs.security_review }}
          QA_PASSED: ${{ needs.qa-review.outputs.qa_passed }}
          SECURITY_JOB_RESULT: ${{ needs.security-review.result }}
        run: |
          set -euo pipefail
          QA_PATH="$RUNNER_TEMP/ledger-qa-review/ledger-qa-review.json"
          if [ "$SECURITY_REQUIRED" = 'true' ] && [ "$QA_PASSED" = 'true' ]; then
            test "$SECURITY_JOB_RESULT" = 'success'
            SECURITY_PATH="$RUNNER_TEMP/ledger-security-review/ledger-security-review.json"
            test -s "$SECURITY_PATH"
            python -I -S "$RUNNER_TEMP/ledger-base-tree/agent_operator/review_gate.py" "$QA_PATH" "$SECURITY_PATH"
          else
            python -I -S "$RUNNER_TEMP/ledger-base-tree/agent_operator/review_gate.py" "$QA_PATH"
          fi

      - name: Post validated reviewer evidence to exact draft PR
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.publish-task.outputs.pr_number }}
          SECURITY_REQUIRED: ${{ needs.claim-task.outputs.security_review }}
          SECURITY_JOB_RESULT: ${{ needs.security-review.result }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/ledger-qa-review/ledger-qa-review.json"
          if [ "$SECURITY_REQUIRED" = 'true' ] && [ "$SECURITY_JOB_RESULT" = 'success' ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/ledger-security-review/ledger-security-review.json"
          fi

      - name: Mark reviewed work awaiting human merge review
        if: steps.reviewer_gate.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
          PR_URL: ${{ needs.publish-task.outputs.pr_url }}
        run: >-
          cd "$RUNNER_TEMP/ledger-base-tree" &&
          python -m agent_operator.transition
          --issue "$ISSUE_NUMBER"
          --state agent:awaiting-review
          --comment "Implementation, frozen-scope verification, clean-room publication, repository test command, and required reviewer gates completed successfully on isolated reviewer runners. Draft PR: $PR_URL. Protected-branch CI and human merge review are still required."

      - name: Stop on reviewer rejection
        if: steps.reviewer_gate.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
          PR_URL: ${{ needs.publish-task.outputs.pr_url }}
        run: |
          cd "$RUNNER_TEMP/ledger-base-tree"
          python -m agent_operator.transition \
            --issue "$ISSUE_NUMBER" \
            --state agent:blocked \
            --comment "Automated reviewer gate rejected or escalated the exact clean-room change. Draft PR preserved for diagnosis: $PR_URL."
          exit 1

  fail-safe-cleanup:
    needs: [claim-task, implement-task, verify-task, publish-task, qa-review, security-review, review-gate]
    if: >-
      always() &&
      needs.claim-task.outputs.execute == 'true' &&
      needs.review-gate.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Recover lifecycle without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim-task.outputs.issue_number }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No claimed issue number available; nothing to recover."
            exit 0
          fi
          CURRENT="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$CURRENT" | grep -qx 'agent:blocked'; then
            echo "Issue #$ISSUE_NUMBER is already blocked."
            exit 0
          fi
          if printf '%s\n' "$CURRENT" | grep -qx 'needs:human'; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Agent execution also failed, but an existing human-intervention state was preserved by the fail-safe job. Inspect the failed workflow before any retry."
            echo "Issue #$ISSUE_NUMBER already needs human review; preserving that state."
            exit 0
          fi
          for LABEL in agent:ready agent:claimed agent:working agent:awaiting-review; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'agent:blocked'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Agent execution stopped before a clean reviewed publication completed. Lifecycle was recovered by the separate fail-safe job. Inspect the failed workflow stage before any retry."
