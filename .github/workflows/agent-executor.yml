          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')" = "$PROPOSAL_SHA"
          python -I -S "$RUNNER_TEMP/ledger-base-tree/agent_operator/scope_guard.py" check \
