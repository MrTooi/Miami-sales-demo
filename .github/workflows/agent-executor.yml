          set -euo pipefail
          CONTEXT="$RUNNER_TEMP/ledger-review-context/context.json"
          TASK="$RUNNER_TEMP/ledger-task-contract/task.json"
          PROMPT="$RUNNER_TEMP/ledger-task-contract/prompt.md"
          test "$(jq -r '.issue_number' "$CONTEXT")" = "$ISSUE_NUMBER"
          test "$(jq -r '.branch' "$CONTEXT")" = "$BRANCH"
          test "$(jq -r '.base_sha' "$CONTEXT")" = "$BASE_SHA"
          test "$(jq -r '.proposal_sha' "$CONTEXT")" = "$PROPOSAL_SHA"
          test "$(jq -r '.task_sha' "$CONTEXT")" = "$EXPECTED_TASK_SHA"
          test "$(jq -r '.prompt_sha' "$CONTEXT")" = "$EXPECTED_PROMPT_SHA"
          test "$(jq -r '.pr_number' "$CONTEXT")" = "$PR_NUMBER"
          test "$(sha256sum "$TASK" | cut -d' ' -f1)" = "$EXPECTED_TASK_SHA"
          test "$(sha256sum "$PROMPT" | cut -d' ' -f1)" = "$EXPECTED_PROMPT_SHA"
          test "$(git rev-parse HEAD)" = "$PROPOSAL_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$PROPOSAL_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName,baseRefName,isDraft,state --jq '.headRefOid')" = "$PROPOSAL_SHA"
