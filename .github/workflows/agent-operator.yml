name: LEDGER AI Team Operator

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
    - cron: '2,7,12,22,27,32,37,42,52,57 * * * *'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ledger-agent-operator-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan-next-task:
    if: github.event_name == 'workflow_dispatch' || vars.LEDGER_AGENT_OPERATOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify operator unit tests
        run: python -m unittest tests.test_agent_operator tests.test_agent_operator_workflow -v
      - name: Plan next queued task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_OPERATOR_OUTPUT: agent_operator_plan.json
        run: python -m agent_operator.cli

  final-readiness:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/agent-final-readiness-core.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
