name: LEDGER AI Task Executor Trigger

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/agent-run' &&
      contains(github.event.issue.labels.*.name, 'agent:ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: read
    steps:
      - name: Require commented issue is the only ready task
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          READY_NUMBERS="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label 'agent:ready' --limit 100 --json number --jq '.[].number')"
          READY_COUNT="$(printf '%s\n' "$READY_NUMBERS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$READY_COUNT" != "1" ] || [ "$READY_NUMBERS" != "$ISSUE_NUMBER" ]; then
            echo "Refusing dispatch: commented issue must be the only open agent:ready task." >&2
            exit 1
          fi

      - name: Dispatch canonical executor
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent-executor.yml --repo "$GITHUB_REPOSITORY" --ref main
