name: Agent final readiness schedule probe

on:
  schedule:
    - cron: '2-57/5 * * * *'

permissions: {}

jobs:
  prove-scheduler:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record schedule provenance
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'schedule'
          printf 'event=%s\nrun_id=%s\nattempt=%s\nsha=%s\nref=%s\n' \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_SHA" \
            "$GITHUB_REF"
