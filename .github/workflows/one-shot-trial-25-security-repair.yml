name: One-shot trial 25 Security repair

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  security-repair-trial-25:
    if: >-
      github.event.issue.number == 25 &&
      github.event.comment.body == '/ledger-security-review-25' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ISSUE_NUMBER: '25'
      PR_NUMBER: '39'
      BRANCH: 'agent/issue-25-38667506613'
      REVIEWED_SHA: '5cb3cf63d83299806d7ae5671aae883d3bc6317a'
      PRIOR_REVIEW_RUN: '38782781370'
      SECURITY_REVIEW_PATH: /tmp/ledger-trial-25-security-review.json

    steps:
      - name: Freeze trusted review controls from protected main
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          for SPEC in \
            'agent_operator/review_gate.py:ledger-review-gate.py' \
            'agent_operator/review_schema.json:ledger-review-schema.json'; do
            SOURCE="${SPEC%%:*}"
            DEST="${SPEC##*:}"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "/repos/$GITHUB_REPOSITORY/contents/$SOURCE?ref=$CONTROL_SHA" > "$RUNNER_TEMP/$DEST"
          done
          sha256sum "$RUNNER_TEMP/ledger-review-gate.py" "$RUNNER_TEMP/ledger-review-schema.json" \
            > "$RUNNER_TEMP/ledger-review-controls.sha256"
          chmod a-w "$RUNNER_TEMP/ledger-review-gate.py" "$RUNNER_TEMP/ledger-review-schema.json" \
            "$RUNNER_TEMP/ledger-review-controls.sha256"

      - name: Checkout exact preserved proposal commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact branch, PR, scope, and human authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git rev-parse "origin/$BRANCH")" = "$REVIEWED_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')" = "$REVIEWED_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')" = "$BRANCH"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')" = 'main'
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'true'
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = 'OPEN'
          LABELS="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$LABELS" | grep -Eq '^(needs:human|agent:paused)$'; then
            echo 'Human stop is active; refusing Security repair.' >&2
            exit 1
          fi
          printf '%s\n' "$LABELS" | grep -qx 'agent:working'
          git diff-tree --no-commit-id --name-only -r "$REVIEWED_SHA" | sort > "$RUNNER_TEMP/changed-files.txt"
          printf '%s\n' 'agent_workbench/trial_finance.py' 'tests/test_agent_workbench_trial_finance.py' | sort > "$RUNNER_TEMP/allowed-files.txt"
          diff -u "$RUNNER_TEMP/allowed-files.txt" "$RUNNER_TEMP/changed-files.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c ledger-review-controls.sha256)

      - name: Verify preserved independent QA success from owner bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON="$RUNNER_TEMP/prior-run.json"
          JOBS_JSON="$RUNNER_TEMP/prior-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REVIEW_RUN" > "$RUN_JSON"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REVIEW_RUN/jobs?filter=latest&per_page=100" > "$JOBS_JSON"
          test "$(jq -r '.event' "$RUN_JSON")" = 'issue_comment'
          test "$(jq -r '.actor.login' "$RUN_JSON")" = "$GITHUB_REPOSITORY_OWNER"
          jq -e '
            any(.jobs[]?.steps[]?;
              .name == "Run repository tests against exact proposal" and .conclusion == "success") and
            any(.jobs[]?.steps[]?;
              .name == "Run read-only independent QA reviewer" and .conclusion == "success") and
            any(.jobs[]?.steps[]?;
              .name == "Revalidate exact proposal after QA" and .conclusion == "success")
          ' "$JOBS_JSON" >/dev/null
          printf 'Prior owner bridge %s proves full tests, QA reviewer, and post-QA exact-commit revalidation succeeded.\n' "$PRIOR_REVIEW_RUN"

      - name: Prepare strict Security and Data Integrity prompt
        run: |
          cat > "$RUNNER_TEMP/security-prompt.md" <<'EOF'
          Act as LEDGER's independent Security & Data Integrity reviewer. Read AGENTS.md,
          PROJECT_BRIEF.md, and .github/agents/security-integrity.agent.md. Inspect ONLY the changes
          in origin/main...HEAD. Do not modify any file. Focus especially on exact money arithmetic,
          refunds, provider fees, payout/deposit double counting, unknown transaction kinds, data
          integrity, destructive behavior, secrets, permissions, and whether claims exceed evidence.

          Your final answer MUST be exactly one JSON object matching the supplied output schema.
          Do not use Markdown, code fences, prose before or after the object, or omit any required key.
          Top-level keys are exactly: verdict, summary, findings, tests. Every finding must contain
          exactly: severity, title, evidence. tests must be a JSON array of strings. Use an empty
          findings array when there are no findings. A pass means there is no concrete blocking or
          important Security/Data-Integrity defect in this exact scoped change.
          EOF

      - name: Run read-only Security and Data Integrity reviewer
        id: security
        continue-on-error: true
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          working-directory: ${{ github.workspace }}
          prompt-file: ${{ runner.temp }}/security-prompt.md
          output-schema-file: ${{ runner.temp }}/ledger-review-schema.json
          output-file: ${{ env.SECURITY_REVIEW_PATH }}
          effort: ${{ vars.LEDGER_CODEX_REVIEW_EFFORT || 'medium' }}
          model: ${{ vars.LEDGER_CODEX_REVIEW_MODEL }}

      - name: Revalidate exact proposal and controls after Security attempt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$REVIEWED_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')" = "$REVIEWED_SHA"
          (cd "$RUNNER_TEMP" && sha256sum -c ledger-review-controls.sha256)

      - name: Evaluate Security evidence with protected-main strict gate
        id: gate
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$SECURITY_REVIEW_PATH"
          python -I -S "$RUNNER_TEMP/ledger-review-gate.py" "$SECURITY_REVIEW_PATH"

      - name: Post Security repair evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf 'Trial #25 Security-only repair. Reviewed commit: `%s`\n\n' "$REVIEWED_SHA"
            printf 'Prior owner bridge run `%s`: full repository tests, independent QA, and exact-commit revalidation were verified successful before this Security-only retry.\n\n' "$PRIOR_REVIEW_RUN"
            printf 'Security action outcome: `%s`\n\n### Security & Data Integrity\n' '${{ steps.security.outcome }}'
            cat "$SECURITY_REVIEW_PATH" 2>/dev/null || printf '{"verdict":"needs-human","summary":"Security output missing","findings":[],"tests":[]}'
            printf '\n\nStrict protected-main Security gate outcome: `%s`\n' '${{ steps.gate.outcome }}'
          } > "$RUNNER_TEMP/security-repair-evidence.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/security-repair-evidence.md"

      - name: Promote exact proposal to awaiting human review
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABELS="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if printf '%s\n' "$LABELS" | grep -Eq '^(needs:human|agent:paused)$'; then exit 1; fi
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$REVIEWED_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')" = "$REVIEWED_SHA"
          for LABEL in agent:ready agent:claimed agent:working agent:blocked; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'agent:awaiting-review'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Trial #25 review lifecycle completed on exact preserved commit \`$REVIEWED_SHA\`. Prior owner-run full tests and independent QA were reverified, and Security/Data Integrity evidence passed the strict protected-main gate. Draft PR #$PR_NUMBER remains unmerged for human review."

      - name: Block on missing, malformed, escalated, or rejected Security evidence
        if: steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for LABEL in agent:ready agent:claimed agent:working agent:awaiting-review; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'agent:blocked'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Trial #25 Security-only repair did not produce evidence accepted by the strict protected-main gate for exact commit \`$REVIEWED_SHA\`. Draft PR #$PR_NUMBER was preserved; implementation and QA were not rerun."
          exit 1
